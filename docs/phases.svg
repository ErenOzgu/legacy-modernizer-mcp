<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="t d"><title id="t">Migration phases</title><desc id="d">Six phases: safety net, Python 2/3 compatibility, Django to 1.11, switch to Python 3, climb LTS releases, clean up.</desc><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1626"/><stop offset="1" stop-color="#123049"/></linearGradient>
<radialGradient id="glow" cx="0.82" cy="0.2" r="0.7"><stop offset="0" stop-color="#2FB6C4" stop-opacity="0.22"/><stop offset="1" stop-color="#2FB6C4" stop-opacity="0"/></radialGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.045"/></pattern>
<filter id="shadow" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
</defs><rect width="1200" height="400" rx="18" fill="url(#bg)"/><rect width="1200" height="400" rx="18" fill="url(#dots)"/><rect width="1200" height="400" rx="18" fill="url(#glow)"/><text x="48" y="46" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" font-weight="600" fill="#2FB6C4" text-anchor="start" letter-spacing="0.4">What generate_migration_plan produces</text><rect x="48.0" y="74" width="162.33333333333334" height="152" rx="12" fill="#0F2036" stroke="#25405F"/><rect x="48.0" y="74" width="162.33333333333334" height="4" rx="2" fill="#F2B33D"/><text x="66.0" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="700" fill="#F2B33D" text-anchor="start">0</text><text x="66.0" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF5" text-anchor="start">Safety net</text><text x="66.0" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">tests, pinned deps, CI</text><path d="M214.33333333333334 150 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8FA3BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="236.33333333333334" y="74" width="162.33333333333334" height="152" rx="12" fill="#0F2036" stroke="#25405F"/><rect x="236.33333333333334" y="74" width="162.33333333333334" height="4" rx="2" fill="#F2B33D"/><text x="254.33333333333334" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="700" fill="#F2B33D" text-anchor="start">1</text><text x="254.33333333333334" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF5" text-anchor="start">Py 2/3 compat</text><text x="254.33333333333334" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">fix syntax and stdlib,</text><text x="254.33333333333334" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">no behaviour change</text><path d="M402.6666666666667 150 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8FA3BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="424.6666666666667" y="74" width="162.33333333333334" height="152" rx="12" fill="#0F2036" stroke="#25405F"/><rect x="424.6666666666667" y="74" width="162.33333333333334" height="4" rx="2" fill="#F2B33D"/><text x="442.6666666666667" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="700" fill="#F2B33D" text-anchor="start">2</text><text x="442.6666666666667" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF5" text-anchor="start">Django → 1.11</text><text x="442.6666666666667" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">one LTS at a time,</text><text x="442.6666666666667" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">still on Python 2.7</text><path d="M591.0 150 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8FA3BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="613.0" y="74" width="162.33333333333334" height="152" rx="12" fill="#0F2036" stroke="#25405F"/><rect x="613.0" y="74" width="162.33333333333334" height="4" rx="2" fill="#2FB6C4"/><text x="631.0" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="700" fill="#2FB6C4" text-anchor="start">3</text><text x="631.0" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF5" text-anchor="start">Switch to Py 3</text><text x="631.0" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">run 1.11 on Python 3,</text><text x="631.0" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">fix what breaks</text><path d="M779.3333333333334 150 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8FA3BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="801.3333333333334" y="74" width="162.33333333333334" height="152" rx="12" fill="#0F2036" stroke="#25405F"/><rect x="801.3333333333334" y="74" width="162.33333333333334" height="4" rx="2" fill="#2FB6C4"/><text x="819.3333333333334" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="700" fill="#2FB6C4" text-anchor="start">4</text><text x="819.3333333333334" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF5" text-anchor="start">Climb the LTS</text><text x="819.3333333333334" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">2.2 → 3.2 →</text><text x="819.3333333333334" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">4.2 → 5.2</text><path d="M967.6666666666667 150 h16 m-6 -6 l6 6 l-6 6" fill="none" stroke="#8FA3BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="989.6666666666667" y="74" width="162.33333333333334" height="152" rx="12" fill="#0F2036" stroke="#25405F"/><rect x="989.6666666666667" y="74" width="162.33333333333334" height="4" rx="2" fill="#2FB6C4"/><text x="1007.6666666666667" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="26" font-weight="700" fill="#2FB6C4" text-anchor="start">5</text><text x="1007.6666666666667" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#E6EDF5" text-anchor="start">Clean up</text><text x="1007.6666666666667" y="174" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">drop six and shims,</text><text x="1007.6666666666667" y="194" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" font-weight="400" fill="#8FA3BA" text-anchor="start">add linting</text><text x="48" y="262" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8FA3BA" text-anchor="start" letter-spacing="1.6">PYTHON</text><rect x="48.0" y="270" width="539.0" height="34" rx="9" fill="#F2B33D" fill-opacity="0.16" stroke="#F2B33D" stroke-opacity="0.6"/><text x="317.5" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#F2B33D" text-anchor="middle" letter-spacing="0.3">Python 2.7</text><rect x="613.0" y="270" width="539.0" height="34" rx="9" fill="#2FB6C4" fill-opacity="0.16" stroke="#2FB6C4" stroke-opacity="0.6"/><text x="882.5" y="292" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#2FB6C4" text-anchor="middle" letter-spacing="0.3">Python 3</text><text x="48" y="330" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="600" fill="#8FA3BA" text-anchor="start" letter-spacing="1.6">DJANGO</text><rect x="48.0" y="338" width="350.6666666666667" height="34" rx="9" fill="#8FA3BA" fill-opacity="0.16" stroke="#8FA3BA" stroke-opacity="0.6"/><text x="223.33333333333334" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#8FA3BA" text-anchor="middle" letter-spacing="0.3">your current version</text><rect x="424.6666666666667" y="338" width="350.6666666666667" height="34" rx="9" fill="#F2B33D" fill-opacity="0.16" stroke="#F2B33D" stroke-opacity="0.6"/><text x="600.0" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#F2B33D" text-anchor="middle" letter-spacing="0.3">1.11 (last to support 2.7)</text><rect x="801.3333333333334" y="338" width="350.66666666666663" height="34" rx="9" fill="#2FB6C4" fill-opacity="0.16" stroke="#2FB6C4" stroke-opacity="0.6"/><text x="976.6666666666667" y="360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="13.5" font-weight="600" fill="#2FB6C4" text-anchor="middle" letter-spacing="0.3">up to 5.2</text><rect x="0.5" y="0.5" width="1199" height="399" rx="18" fill="none" stroke="#25405F"/></svg>
