rve"><tspan fill="#8FA3BA" font-weight="400">  3. </tspan><tspan fill="#E6EDF5" font-weight="400">shop/settings.py   </tspan><tspan fill="#F2B33D" font-weight="400">score 18   </tspan><tspan fill="#F0716B" font-weight="400"> 6 errors</tspan></text><text x="54" y="428" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8FA3BA" font-weight="400">  4. </tspan><tspan fill="#E6EDF5" font-weight="400">shop/models.py     </tspan><tspan fill="#F2B33D" font-weight="400">score 15   </tspan><tspan fill="#F0716B" font-weight="400"> 3 errors</tspan></text><text x="54" y="474" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#2FB6C4" font-weight="700">Django APIs that block upgrades</tspan></text><text x="54" y="497" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F2B33D" font-weight="400">  → 1.10  </tspan><tspan fill="#E6EDF5" font-weight="400">DJ-PATTERNS            </tspan><tspan fill="#8FA3BA" font-weight="400">patterns() in urlpatterns   </tspan><tspan fill="#E6EDF5" font-weight="400">×2</tspan></text><text x="54" y="520" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F2B33D" font-weight="400">  → 2.0   </tspan><tspan fill="#E6EDF5" font-weight="400">DJ-FK-ON-DELETE        </tspan><tspan fill="#8FA3BA" font-weight="400">ForeignKey, no on_delete    </tspan><tspan fill="#E6EDF5" font-weight="400">×2</tspan></text><text x="54" y="543" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#F2B33D" font-weight="400">  → 3.0   </tspan><tspan fill="#E6EDF5" font-weight="400">DJ-RENDER-TO-RESPONSE  </tspan><tspan fill="#8FA3BA" font-weight="400">render_to_response          </tspan><tspan fill="#E6EDF5" font-weight="400">×2</tspan></text><text x="54" y="589" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14.5" xml:space="preserve"><tspan fill="#8FA3BA" font-weight="400">  Next: Phase 0 safety net → Phase 1 make it run on 2.7 and 3 → ...</tspan></text><rect x="0.5" y="0.5" width="919" height="655" rx="18" fill="none" stroke="#25405F"/></svg>
