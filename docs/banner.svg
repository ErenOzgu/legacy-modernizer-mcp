<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d"><title id="t">legacy-modernizer-mcp</title><desc id="d">MCP server that scans and plans the migration of legacy Python 2 and old Django projects.</desc><defs>
