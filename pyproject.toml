[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "legacy-modernizer-mcp"
version = "0.1.0"
description = "MCP server that scans legacy Python 2 / Django projects and produces a step-by-step migration plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Eren Özgü" }]
keywords = ["mcp", "model-context-protocol", "python2", "python3", "django", "migration", "legacy", "modernization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["mcp>=1.2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
legacy-modernizer-mcp = "legacy_modernizer_mcp.server:main"

[project.urls]
Homepage = "https://github.com/ErenOzgu/legacy-modernizer-mcp"
Issues = "https://github.com/ErenOzgu/legacy-modernizer-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_modernizer_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
norecursedirs = ["fixtures"]
